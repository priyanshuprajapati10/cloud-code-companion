<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Code Companion</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 850px; margin: 2rem auto; padding: 0 1rem; color: #1f2328; }
    textarea { width: 100%; height: 220px; font-family: monospace; font-size: 14px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; box-sizing: border-box; resize: vertical; }
    .controls { margin: 12px 0; display: flex; gap: 10px; }
    button { padding: 10px 18px; font-weight: 600; cursor: pointer; border: none; border-radius: 6px; background: #0969da; color: #fff; transition: background 0.2s; }
    button:hover { background: #0856b3; }
    button:disabled { background: #8c959f; cursor: not-allowed; }
    pre { background: #f6f8fa; border: 1px solid #d0d7de; padding: 16px; border-radius: 6px; white-space: pre-wrap; font-family: monospace; min-height: 120px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Cloud Code Companion (Gemma 2 9B)</h2>
  <p>Paste code below for instant bug detection or review—no local models or installs required.</p>

  <textarea id="codeInput" placeholder="Paste your code snippet here..."></textarea>

  <div class="controls">
    <button id="bugBtn" onclick="runTask('bugs')">Find Bugs & Fixes</button>
    <button id="reviewBtn" onclick="runTask('review')">Run Peer Review</button>
  </div>

  <h3>Result:</h3>
  <pre id="output">Output will appear here...</pre>

  <script>
    async function runTask(taskType) {
      const code = document.getElementById('codeInput').value;
      const output = document.getElementById('output');
      const bugBtn = document.getElementById('bugBtn');
      const reviewBtn = document.getElementById('reviewBtn');

      if (!code.trim()) {
        alert("Please paste some code first.");
        return;
      }

      bugBtn.disabled = true;
      reviewBtn.disabled = true;
      output.innerText = "Analyzing code via Gemma 2 on Groq...";

      try {
        const response = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, task: taskType })
        });

        const data = await response.json();
        output.innerText = data.result || data.error;
      } catch (err) {
        output.innerText = "Failed to connect to the server.";
      } finally {
        bugBtn.disabled = false;
        reviewBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
